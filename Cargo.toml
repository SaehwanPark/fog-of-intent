[workspace]
members = [
  ".",
  "crates/foi-kernel",
  "crates/foi-lane",
  "crates/foi-map",
  "crates/foi-agent",
]
resolver = "2"

[package]
name = "fog-of-intent"
version = "0.1.235"
edition = "2024"
rust-version = "1.96"
license = "MIT"
default-run = "fog-of-intent"

[lints.clippy]
as_conversions = "deny"

[dependencies]
foi-kernel = { path = "crates/foi-kernel" }
foi-lane = { path = "crates/foi-lane" }
foi-map = { path = "crates/foi-map" }
foi-agent = { path = "crates/foi-agent" }
reedline = "0.49"

[[bin]]
name = "fog-of-intent"
path = "src/main.rs"

[[bin]]
name = "fog-of-intent-mcp"
path = "src/bin/fog-of-intent-mcp.rs"
